name: R8P3 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies (Tesseract)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr libgl1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

        - name: Run unit tests with pytest
      run: |
        mkdir -p config
        touch config/secrets.yaml
        touch .env
        pytest tests/ -v
