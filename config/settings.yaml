project:
  name: "R8P3-Pipeline"
  version: "1.0.0"
  description: "Scalable Multilingual OCR & Hybrid RAG for Historical Computable Law"

ocr:
  supported_scripts:
    - "modern"
    - "fraktur"
    - "latin"
    - "greek_ancient"
    - "old_french"
  default_script: "latin"
  tessdata_config: "--oem 3 --psm 6"
  throttle_delay_seconds: 0.3
  cpu_thermal_safeguard: true

search:
  tantivy:
    index_path: "./data/tantivy_index"
    primary_key: "doc_id"
  qdrant:
    host: "localhost"
    port: 6333
    collection_name: "historical_legal_corpus"
    vector_size: 768
  fusion:
    alpha: 0.5  # Équilibrage entre correspondance lexicale exacte (Tantivy) et sémantique vectorielle (Qdrant)

logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{msg}</level>"
